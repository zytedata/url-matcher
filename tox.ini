[tox]
envlist = min,py3{10-14},mypy,docs
requires = tox>=4.25

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0

commands =
    py.test \
        --cov-report=term --cov-report=html --cov-report=xml --cov=url_matcher \
        --cov-report=term-missing --doctest-modules \
        --junitxml=testenv.junit.xml -o junit_family=legacy \
        {posargs:url_matcher tests}

[testenv:min]
basepython = python3.10
deps =
    {[testenv]deps}
    tldextract==1.3.1

[testenv:mypy]
deps =
    mypy==2.3.0
    pytest==9.1.1
commands =
    mypy url_matcher tests

[docs]
changedir = docs
deps =
    -rdocs/requirements.txt

[testenv:docs]
basepython = python3
changedir = {[docs]changedir}
deps = {[docs]deps}
commands =
    sphinx-build -W -b html . {envtmpdir}/html

[testenv:pre-commit]
deps =
    pre-commit
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.5.0
commands =
    python -m build --sdist
    twine check dist/*
